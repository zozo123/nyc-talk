<!doctype html><html lang="en"><meta charset="utf-8">
<title>NYC talk - recorded evidence</title><style>
:root{color-scheme:dark}body{margin:0;padding:5vh 5vw;background:#111518;color:#f2f3ee;font:22px system-ui}
header{color:#8fe3cb;font-size:17px;letter-spacing:.1em}h1{font-size:38px;max-width:1200px}
pre{font:clamp(13px,1.65vw,24px)/1.65 monospace;white-space:pre-wrap;overflow-wrap:anywhere;background:#1b2329;padding:28px}
button{font:20px system-ui;padding:12px 24px;background:#1b2329;color:#f2f3ee;border:1px solid #40515b;cursor:pointer}
footer{margin-top:22px;color:#acb9c2;font-size:16px}</style>
<header>RECORDED EVIDENCE / SYNTHETIC FIXTURES / OFFLINE REPLAY</header>
<h1 id="title"></h1><pre id="body"></pre>
<button id="prev">Previous</button> <button id="next">Next</button>
<footer id="page"></footer><script>const scenes=[{"id": "credentials", "title": "The token reaches another project", "body": "credentials.before\nBroad inherited fixture token reads unrelated project.\n\ncredentials.after\nScoped token receives HTTP 403.\n\ncredentials.positive\nTask input remains readable."}, {"id": "mounts", "title": "The write reaches the next job", "body": "mount.before\nWritable bind changes the next-job fixture on the host.\n\nmount.after\nRead-only bind blocks the same write; host fixture unchanged.\n\nmount.positive\nTask output remains writable."}, {"id": "egress", "title": "The upload reaches another account", "body": "egress.before\nLoopback service stores synthetic private bytes under the other account.\n\negress.no_delivery\nRejected requests create no receiving-service deliveries.\n\negress.bypass\nNew network namespace cannot reach host loopback fixture service.\n\negress.positive\nBroker constructs a fixed report for the team account."}, {"id": "verifier", "title": "The checker is unchanged. The expectations are not.", "body": "checker.py before: f5d8d3468bbeeee014580159053a10a4af758a11a22af3045b03abcf94922e99\nchecker.py after:  f5d8d3468bbeeee014580159053a10a4af758a11a22af3045b03abcf94922e99\n\nWorker-controlled expectations -> PASS\nIndependent criteria accepted -> False\n\nadmin:none observed -> 200\nadmin:none required -> 401\n\nCLI authorization-policy model; not an HTTP server."}, {"id": "acceptance", "title": "Fresh swap, original publication, then replay", "body": "Fresh swapped digest -> DENIED\n\nOriginal exact bytes -> PUBLISHED\n\nConsumed approval -> DENIED\n\nIncorrect candidate -> NOT_PUBLISHED"}];let index=0;
function show(){document.getElementById('title').textContent=scenes[index].title;
document.getElementById('body').textContent=scenes[index].body;
document.getElementById('page').textContent=`${index+1} / ${scenes.length} - Arrow keys change the observation. No new experiment is running.`;}
function move(n){index=Math.max(0,Math.min(scenes.length-1,index+n));show();}
document.getElementById('prev').onclick=()=>move(-1);document.getElementById('next').onclick=()=>move(1);
document.onkeydown=e=>{if(e.key==='ArrowRight')move(1);if(e.key==='ArrowLeft')move(-1);};show();</script></html>
