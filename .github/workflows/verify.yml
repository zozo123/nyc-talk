name: Verify talk experiments
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-boundaries:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    outputs:
      patch_sha: ${{ steps.bundle.outputs.patch_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install isolated lab and Beamer runtime
        run: sudo apt-get update && sudo apt-get install -y bubblewrap texlive-latex-recommended texlive-pictures lmodern
      - name: Verify committed evidence before rerunning anything
        run: make evidence
      - name: Run controller and evidence regression suite
        run: |
          mkdir -p build
          set -o pipefail
          make test 2>&1 | tee build/tests.log
      - name: Reproduce and record the actual Linux experiments
        run: make record-all
      - name: Build final PDF, editable PowerPoint and offline replay
        run: npm ci --prefix slides --ignore-scripts && make snapshot
      - name: Replay recorded evidence
        run: |
          set -o pipefail
          make replay | tee build/replay.txt
      - name: Package the tested working tree
        id: bundle
        run: |
          mkdir -p build/release
          git add evidence slides/talk.tex slides/talk.pdf slides/talk.pptx slides/evidence.tex TALK.md SPEAKER_NOTES.md demo/replay.html
          git diff --cached --binary > build/release/generated.patch
          echo "patch_sha=$(sha256sum build/release/generated.patch | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
          git ls-files -z | tar --null -T - -cf build/release/source.tar
          git rev-parse HEAD > build/release/BASE_COMMIT.txt
          sha256sum build/release/source.tar slides/talk.pdf slides/talk.pptx > build/release/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: nyc-talk-final
          path: |
            build/release
            build/tests.log
            build/replay.txt
            build/nyc-talk.pptx
            slides/talk.pdf
            slides/talk.pptx
            demo/replay.html
            evidence
            TALK.md
            SPEAKER_NOTES.md
            RUNBOOK.md
            QUESTIONS.md
            research
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: failed-experiment-diagnostics
          path: build
          if-no-files-found: ignore
  record-final-branch:
    if: github.event_name == 'push' && github.ref == 'refs/heads/final/oct21-evidence-backed-talk'
    needs: linux-boundaries
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: nyc-talk-final
          path: tested
      - name: Commit only the tested generated files
        env:
          EXPECTED_PATCH_SHA: ${{ needs.linux-boundaries.outputs.patch_sha }}
        run: |
          echo "$EXPECTED_PATCH_SHA  tested/build/release/generated.patch" | sha256sum -c -
          git apply --index tested/build/release/generated.patch
          git diff --cached --name-only | while read -r path; do
            case "$path" in
              evidence/*|slides/talk.tex|slides/talk.pdf|slides/talk.pptx|slides/evidence.tex|TALK.md|SPEAKER_NOTES.md|demo/replay.html) ;;
              *) echo "Unexpected generated path: $path"; exit 1 ;;
            esac
          done
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -c core.hooksPath=/dev/null commit -m 'Record reconciled, verified presentation and offline replay'
          git push origin HEAD:refs/heads/final/oct21-evidence-backed-talk
